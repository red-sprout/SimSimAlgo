services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.6.4}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in n8n/.env}
      # Access is restricted to the SSH-forwarded loopback port in this setup.
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "1000"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      sync-worker:
        condition: service_healthy

  sync-worker:
    build:
      context: ../automation
    restart: unless-stopped
    env_file:
      - ../automation/.env
    environment:
      PORT: "3000"
      REPOSITORY_ROOT: /repo
      SYNC_STATE_FILE: /state/sync.json
      GIT_COMMIT: "true"
      GIT_PUSH: "true"
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-red-sprout}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-jjw05015@gmail.com}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-red-sprout}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-jjw05015@gmail.com}
      GIT_SSH_COMMAND: ssh -i /run/secrets/github_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known_hosts
    volumes:
      - ${SIMSIMALGO_REPOSITORY_PATH:?set repository path in n8n/.env}:/repo
      - ${SIMSIMALGO_DEPLOY_KEY_PATH:?set deploy key path in n8n/.env}:/run/secrets/github_deploy_key:ro
      - sync_state:/state
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  n8n_data:
  sync_state:
